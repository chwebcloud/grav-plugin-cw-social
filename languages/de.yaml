PLUGIN_CW_SOCIAL:
  TAB: 'Teilen'
  SECTION: 'Social Media (CHWEB Social)'
  HINT: 'Hier stellst du ein, ob diese Seite nach dem Speichern auf Facebook und Instagram erscheint. Das passiert von selbst beim nächsten Lauf – sobald die Seite veröffentlicht ist und ihr Datum erreicht hat. Unten siehst du vorher, wie der Beitrag aussieht.'
  SHARE_LABEL: 'Auf Facebook teilen'
  SHARE_HELP: 'Ja: Nach dem Speichern erscheint ein Beitrag mit Link auf der Facebook-Seite. Bild und Titel holt Facebook von dieser Seite.'
  INSTAGRAM_LABEL: 'Auf Instagram teilen'
  INSTAGRAM_HELP: 'Ja: Nach dem Speichern erscheint das Titelbild mit dem Text auf Instagram. Ohne Bild gibt es keinen Beitrag. Instagram macht den Link nicht anklickbar, er steht als Text dabei.'
  MESSAGE_LABEL: 'Eigener Text (optional)'
  MESSAGE_HELP: 'Leer: Titel und Einleitung, so wie in der Vorschau unten. Gilt für beide Kanäle.'
  VORSCHAU_LABEL: 'So sieht der Beitrag aus'
  VORSCHAU_HELP: 'Folgt jeder Änderung an Titel, Einleitung, Datum, Titelbild, eigenem Text und den Schaltern – noch vor dem Speichern. Darüber steht, ob und wann schon geteilt wurde.'
  ERNEUT_LABEL: 'Nochmals teilen'
  ERNEUT_HELP: 'Ja: Beim nächsten Speichern geht der Beitrag auf den eingeschalteten Kanälen nochmals raus – zum Beispiel als Erinnerung kurz vor dem Anlass. Der Schalter springt danach von selbst auf Nein.'
  ENABLED_LABEL: "Plugin aktiviert"
  FB_SECTION_TITLE: "Facebook (Meta Graph API)"
  PAGE_ID_LABEL: "Facebook Page-ID"
  PAGE_ID_HELP: "Die numerische ID der Facebook-Seite (Seite -> Info -> Seiten-ID)."
  ACCESS_TOKEN_LABEL: "Page Access Token"
  ACCESS_TOKEN_HELP: "Langlebiger Page-Token aus der Meta-App (Graph API Explorer -> Page Token). Wird nur zu graph.facebook.com gesendet. Für Instagram braucht er zusätzlich instagram_basic und instagram_content_publish."
  API_VERSION_LABEL: "API-Version"
  IG_SECTION_TITLE: "Instagram"
  IG_USER_ID_LABEL: "Instagram-Konto-ID (optional)"
  IG_USER_ID_HELP: "Leer lassen: das Plugin liest die ID des verbundenen Kontos über die Facebook-Seite. Nur eintragen, wenn der Test das Konto nicht findet."
  PAGES_SECTION_TITLE: "Welche Seiten"
  ROUTES_LABEL: "Elternseiten (Routen)"
  ROUTES_HELP: "Die Kinder dieser Seiten können geteilt werden. Mehrere mit Komma, z. B. /news, /events"
  TEMPLATES_LABEL: "Seitentypen"
  TEMPLATES_HELP: "Nur Seiten dieser Vorlagen bekommen den Reiter «Teilen». Mehrere mit Komma, z. B. item, event"
  URL_SECTION_TITLE: "Öffentliche Adresse (Pflicht)"
  SITE_URL_LABEL: "Öffentliche Site-URL"
  SITE_URL_HELP: "Basis für die geposteten Links und das Instagram-Bild, z. B. https://example.com — nie localhost, nie eine Testdomain. Ohne diese Angabe wird nicht gepostet: Es gibt bewusst keinen Rückfall auf den gerade aufgerufenen Host, sonst würde eine Kopie der Website auf einer Testdomain Beiträge mit Links auf die Testdomain veröffentlichen."
  SITE_URL_PLACEHOLDER: "https://example.com"
  BEHAVIOR_SECTION_TITLE: "Wann gepostet wird"
  SCHEDULER_LABEL: "Über den Zeitplaner posten"
  SCHEDULER_HELP: "Der vorgesehene Weg. Der Auftrag läuft ausserhalb der Seitenanfragen und darf auf Instagram warten. Ein- und ausschalten lässt er sich auch unter Werkzeuge → Zeitplaner; dort muss der Cron-Eintrag von Grav eingerichtet sein."
  SCHEDULER_AT_LABEL: "Takt (Cron)"
  SCHEDULER_AT_HELP: "Cron-Schreibweise, Vorgabe */15 * * * * (alle 15 Minuten)."
  AUTO_SHARE_LABEL: "Ohne Zeitplaner: in der Seitenanfrage posten"
  AUTO_SHARE_HELP: "Nur für Installationen ohne Cron. Prüft gedrosselt und mit Sperre, ob etwas fällig ist, und postet es während der Anfrage eines Besuchers. Das macht diese Anfrage langsamer und kann auf Instagram nicht lange warten – darum ab Werk aus."
  THROTTLE_MINUTES_LABEL: "Prüf-Intervall (Minuten)"
  THROTTLE_MINUTES_HELP: "Gilt nur für den Weg ohne Zeitplaner."
  MAX_ATTEMPTS_LABEL: "Versuche je Seite und Kanal"
  MAX_ATTEMPTS_HELP: "Danach wird dieser Kanal für diese Seite nicht mehr versucht; der Grund steht im Protokoll der Website. Ohne diese Bremse läuft ein Bild, das Instagram nie annimmt, in jedem Lauf erneut in die Wartezeit."
  TEXT_SECTION_TITLE: "Text des Beitrags"
  MESSAGE_TEMPLATE_LABEL: "Text-Vorlage"
  MESSAGE_TEMPLATE_HELP: "Platzhalter: {title}, {summary}, {url}, {datum}. Je Seite übersteuerbar. Bei Instagram hängt das Plugin den Link als Text an."
  DATE_FORMAT_LABEL: "Datumsformat für {datum}"
  DATE_FORMAT_HELP: "Schreibweise wie in der PHP-Funktion date(). Leer: es gilt, was die Website für kurze Datumsangaben eingestellt hat (System → Seiten)."
  DATE_FORMAT_PLACEHOLDER: "d.m.Y"
  ENABLED: "Aktiviert"
  DISABLED: "Deaktiviert"
  YES_OPTION: "Ja"
  NO_OPTION: "Nein"
  HINWEIS_FB_OFFEN: "Facebook-Seite noch nicht verbunden (Plugins → CHWEB Social). Die Vorschau stimmt, geteilt wird noch nichts."
  HINWEIS_IG_BILD: "Instagram braucht ein Bild auf der Seite (Titelbild oder erstes Bild)."
  HINWEIS_ERNEUT: "«Nochmals teilen» steht auf Ja: Nach dem Speichern geht der Beitrag auf den eingeschalteten Kanälen nochmals raus."
  HINWEIS_ENTWURF: "Die Seite ist ein Entwurf: geteilt wird erst, wenn der Entwurf aufgehoben ist."
  HINWEIS_SITE_URL: "Die öffentliche Site-URL fehlt (Plugins → CHWEB Social). Solange sie fehlt, wird nicht gepostet – ein Beitrag mit einem Link auf eine Testdomain wäre schlimmer als keiner."
