enabled: false

# ── Facebook (Meta Graph API) ──────────────────────────────
# Page-ID + langlebiger Page-Access-Token: im Admin eintragen.
page_id: ''
access_token: ''
api_version: 'v21.0'

# ── Instagram ──────────────────────────────────────────────
# Braucht ein Instagram-Business-Konto, das mit der Facebook-Seite
# verbunden ist, und denselben Token mit instagram_basic +
# instagram_content_publish. Die Konto-ID holt das Plugin selbst ueber die
# Seite; ig_user_id nur eintragen, wenn das nicht klappt.
instagram: false
ig_user_id: ''

# ── Welche Seiten ──────────────────────────────────────────
# Elternseiten, deren Kinder geteilt werden koennen, und deren Seitentypen.
# Mehrere mit Komma: '/news, /events' bzw. 'item, event'.
routes: '/news'
templates: 'item'

# ── Oeffentliche Adresse: PFLICHT ──────────────────────────
# Ohne sie wird nicht gepostet. Es gibt bewusst keinen Rueckfall auf den
# gerade aufgerufenen Host: Eine Kopie der Website auf einer Testdomain, die
# den Token mitbringt, haette sonst Beitraege mit Links auf die Testdomain
# veroeffentlicht.
site_url: ''              # z. B. https://example.com — NIE localhost

# ── Wann gepostet wird ─────────────────────────────────────
# Der vorgesehene Weg ist der Zeitplaner von Grav (Werkzeuge -> Zeitplaner).
# Er laeuft ausserhalb der Seitenanfragen und darf auf Instagram warten.
scheduler: true
scheduler_at: '*/15 * * * *'

# Ausnahmeweg fuer Installationen ohne Cron: Lauf in einer Seitenanfrage,
# gedrosselt und mit Sperre. Ab Werk aus -- er macht die Seite eines Besuchers
# langsamer und kann auf Instagram nicht lange warten.
auto_share: false
throttle_minutes: 5       # hoechstens alle N Minuten pruefen

# Nach so vielen Fehlversuchen wird ein Kanal einer Seite nicht mehr
# versucht. Ohne diese Bremse laeuft ein Bild, das Instagram nie annimmt, in
# jedem Lauf erneut in die Wartezeit.
max_attempts: 3

# ── Text des Beitrags ──────────────────────────────────────
# Platzhalter: {title} {summary} {url} {datum}  ({datum}: Kopffeld datum oder Seitendatum)
message_template: "{title}\n\n{summary}"
# Datumsformat fuer {datum} (PHP date()). Leer = was die Website fuer kurze
# Datumsangaben eingestellt hat (system.pages.dateformat.short).
date_format: ''
